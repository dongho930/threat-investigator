name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: Migration matches models
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: alembic upgrade head && alembic check

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: worker/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # 수집기 통합 시험(tests/test_collector_browser.py)에 쓰는 Chromium
      - run: python -m playwright install --with-deps chromium
      - run: ruff check .
      - run: ruff format --check .
      # Ubuntu 24.04 러너는 AppArmor가 비특권 user namespace를 막아 Chromium 샌드박스를 쓸 수 없다.
      # 시험 페이지는 러너 안의 로컬 서버뿐이므로 CI에서만 끈다.
      - run: pytest
        env:
          CHROMIUM_SANDBOX: "false"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
