name: security

# 모든 PR과 매주 월요일에 보안 점검을 실행한다. 결과는 docs/security-report.md 작성의 근거가 된다.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  sast-python:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install bandit==1.9.4
      - run: bandit -c backend/pyproject.toml -r backend/app -ll
      - run: bandit -c worker/pyproject.toml -r worker/worker -ll
      - run: bandit -c egress-proxy/pyproject.toml -r egress-proxy/egress_proxy -ll

  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: >-
          semgrep scan --error
          --config p/python --config p/typescript --config p/react
          --config p/secrets --config p/dockerfile
          --exclude testsites

  sca:
    name: SCA (pip-audit, npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r backend/requirements.txt
      - run: pip-audit -r worker/requirements.txt
      - run: npm audit --audit-level=high
        working-directory: frontend

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    # PR 이벤트에서 gitleaks-action은 PR의 커밋 목록을 API로 읽는다. 이 job에만 읽기 권한을 준다.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: Container scan (Trivy)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, worker, frontend, egress-proxy]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ti-${{ matrix.service }}:ci ./${{ matrix.service }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ti-${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
