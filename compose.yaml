# 로컬 개발·시연용 구성. 실행: cp .env.example .env (비밀번호 변경) 후 docker compose up --build
#
# 네트워크 분리 (docs/threat-model.md 신뢰 경계 참고)
#   public : 콘솔 포트 공개용 (frontend만)
#   web    : frontend ↔ backend           (internal)
#   data   : backend·relay ↔ PostgreSQL   (internal)  ← Worker는 DB에 접근할 수 없다
#   jobs   : backend·relay·worker ↔ Redis (internal)
#   api    : worker → backend 내부 API(/internal, 서비스 토큰) (internal)
#   sandbox: worker ↔ egress-proxy (internal)  ← Worker는 인터넷에 직접 닿지 않는다
#   egress : egress-proxy ↔ 조사 대상(testsites, 인터넷). 프록시가 연결마다 목적지 IP를 검사한다.
#   ai     : ai-judge ↔ 모델 서버(laya·llm) (internal)  ← 모델 서버는 인터넷·DB·다른 서비스에 닿지 않는다
#   review-egress: ai-reviewer ↔ egress-proxy (internal)  ← AI 검토 보조는 송신 프록시로만 Anthropic API에 나간다
#
# AI 판정(선택): .env에 AI_MODEL=laya 또는 qwen을 두고 같은 이름의 프로필로 띄운다.
#   docker compose --profile qwen up -d --build     (모델은 한 번에 하나만: 이 PC의 Docker 메모리 3.7GB 기준)

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  restart: unless-stopped

x-backend-env: &backend-env
  ENV: development
  DATABASE_URL: postgresql+psycopg://app:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/investigator
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
  URL_HOST_ALLOWLIST: '["testsites"]'
  # none이면 규칙 판정만(기준선). laya·qwen이면 수집 완료 사건을 judging에 두고 ai-judge가 모델 판단을 더한다.
  AI_MODEL: ${AI_MODEL:-none}

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: investigator
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d investigator"]
      interval: 5s
      retries: 10
    networks: [data]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [jobs]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      db: { condition: service_healthy }
    networks: [data]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: "no"

  backend:
    build: ./backend
    <<: *hardening
    environment:
      <<: *backend-env
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:?set WORKER_API_TOKEN in .env}
      EVIDENCE_DIR: /data/evidence
    read_only: true
    tmpfs: ["/tmp"]
    # 증거 파일은 backend만 쓴다. Worker는 이 볼륨에 접근하지 않고 API로만 업로드한다.
    volumes: ["evidence:/data/evidence"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [web, data, jobs, api]

  outbox-relay:
    build: ./backend
    <<: *hardening
    command: ["python", "-m", "app.services.outbox"]
    environment: *backend-env
    read_only: true
    tmpfs: ["/tmp"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [data, jobs]

  worker:
    build: ./worker
    <<: *hardening
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      API_BASE_URL: http://backend:8000
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:?set WORKER_API_TOKEN in .env}
      URL_HOST_ALLOWLIST: '["testsites"]'
      # 모든 브라우저 요청과 목적지 검사를 송신 프록시로 보낸다.
      EGRESS_PROXY_URL: http://egress-proxy:3128
      # Chromium 자체 샌드박스를 켠다(아래 seccomp 프로필 필요).
      CHROMIUM_SANDBOX: "true"
    read_only: true
    tmpfs: ["/tmp", "/home/pwuser"]
    shm_size: 1gb
    init: true
    # Docker 기본 seccomp 프로필 + Chromium 네임스페이스 샌드박스에 필요한 clone·unshare·setns·chroot 허용.
    # 권한(cap)은 모두 뺀 상태를 유지한다. 생성 방법은 worker/seccomp/generate.py 참고.
    security_opt: ["no-new-privileges:true", "seccomp=./worker/seccomp/chromium.json"]
    depends_on:
      redis: { condition: service_healthy }
      backend: { condition: service_started }
      egress-proxy: { condition: service_started }
    networks: [jobs, api, sandbox]

  ai-judge:
    # 규칙 판정 뒤 모델 판단을 더하는 처리기. 증거는 읽기 전용으로만 연결하고, 인터넷에는 닿지 않는다.
    build: ./backend
    <<: *hardening
    command: ["python", "-m", "app.judging.ai_worker"]
    environment:
      <<: *backend-env
      EVIDENCE_DIR: /data/evidence
    read_only: true
    tmpfs: ["/tmp"]
    volumes: ["evidence:/data/evidence:ro"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [data, ai]
    profiles: ["laya", "qwen"]

  ai-reviewer:
    # AI 검토 보조(기본 꺼짐). .env에 AI_REVIEW_ENABLED=true와 ANTHROPIC_API_KEY를 넣고
    #   docker compose --profile ai-review up -d
    # 검토 필요 사건의 판정 초안만 남긴다(판정·상태 변경 없음, 확정은 사람). 하루 호출 상한 AI_REVIEW_MAX_PER_DAY.
    build: ./backend
    <<: *hardening
    command: ["python", "-m", "app.judging.ai_review"]
    environment:
      <<: *backend-env
      EVIDENCE_DIR: /data/evidence
      AI_REVIEW_ENABLED: ${AI_REVIEW_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_REVIEW_MAX_PER_DAY: ${AI_REVIEW_MAX_PER_DAY:-50}
      HTTPS_PROXY: http://egress-proxy:3128
    read_only: true
    tmpfs: ["/tmp"]
    volumes: ["evidence:/data/evidence:ro"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [data, review-egress]
    profiles: ["ai-review"]

  laya:
    # Laya multilingual(322M, Apache-2.0). 가중치는 이미지에 고정 리비전·해시 검증으로 들어 있다.
    build: ./ai/laya
    <<: *hardening
    read_only: true
    tmpfs: ["/tmp"]
    mem_limit: 2600m
    networks: [ai]
    profiles: ["laya"]

  llm:
    # llama.cpp + Qwen3-1.7B(Q8_0, Apache-2.0). 이미지 다이제스트·가중치 해시 고정, 비root, 웹 UI 끔.
    build: ./ai/llm
    <<: *hardening
    read_only: true
    mem_limit: 2600m
    networks: [ai]
    profiles: ["qwen"]

  feed-collector:
    # 위협정보 피드 자동 수집(자동 탐색). Worker 이미지를 쓰지만 브라우저는 띄우지 않고 목록 파일만 받는다.
    build: ./worker
    <<: *hardening
    command: ["python", "-m", "worker.feed"]
    environment:
      API_BASE_URL: http://backend:8000
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:?set WORKER_API_TOKEN in .env}
      EGRESS_PROXY_URL: http://egress-proxy:3128
      FEED_ENABLED: "true"
      # 기본값: testsites의 모의 피드(가상 시험 페이지만). 실제 피드(Phishing.Database)는 .env에서
      # FEED_URL·FEED_CHECKSUM_URL·FEED_SOURCE를 지정해 켠다(.env.example 참고).
      # 실제 피드를 켜면 목록의 실제 피싱 사이트가 격리 Worker로 조사되므로 허가된 환경에서만 쓴다.
      FEED_URL: ${FEED_URL:-http://testsites:8080/feed/phishing-links-NEW-today.txt}
      FEED_CHECKSUM_URL: ${FEED_CHECKSUM_URL:-http://testsites:8080/feed/phishing-links-NEW-today.txt.sha256}
      FEED_SOURCE: ${FEED_SOURCE:-mock-feed}
      FEED_INTERVAL_SECONDS: ${FEED_INTERVAL_SECONDS:-3600}
      FEED_MAX_PER_RUN: ${FEED_MAX_PER_RUN:-20}
    read_only: true
    tmpfs: ["/tmp"]
    depends_on:
      backend: { condition: service_started }
      egress-proxy: { condition: service_started }
    # api: 등록용 내부 API, sandbox: 송신 프록시(인터넷에는 프록시로만 나감)
    networks: [api, sandbox]

  egress-proxy:
    build: ./egress-proxy
    <<: *hardening
    read_only: true
    environment:
      # 개발용 시험 페이지만 사설 주소여도 허용한다. 운영에서는 비워 둔다.
      EGRESS_HOST_ALLOWLIST: '["testsites"]'
    # 포트를 공개하지 않는다. sandbox(Worker)·review-egress(AI 검토 보조)에서만 접근한다.
    networks: [sandbox, egress, review-egress]

  frontend:
    build: ./frontend
    <<: *hardening
    read_only: true
    tmpfs: ["/tmp"]
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [backend]
    networks: [public, web]

  testsites:
    image: nginxinc/nginx-unprivileged:stable-alpine
    <<: *hardening
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - ./testsites/html:/usr/share/nginx/html:ro
      - ./testsites/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:8081:8080"]
    networks: [egress]

networks:
  public: {}
  web: { internal: true }
  data: { internal: true }
  jobs: { internal: true }
  api: { internal: true }
  sandbox: { internal: true }
  egress: {}
  ai: { internal: true }
  review-egress: { internal: true }

volumes:
  pgdata: {}
  redisdata: {}
  evidence: {}
