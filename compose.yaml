# 로컬 개발·시연용 구성. 실행: cp .env.example .env (비밀번호 변경) 후 docker compose up --build
#
# 네트워크 분리 (docs/threat-model.md 신뢰 경계 참고)
#   public : 콘솔 포트 공개용 (frontend만)
#   web    : frontend ↔ backend           (internal)
#   data   : backend·relay ↔ PostgreSQL   (internal)  ← Worker는 DB에 접근할 수 없다
#   jobs   : backend·relay·worker ↔ Redis (internal)
#   api    : worker → backend 내부 API(/internal, 서비스 토큰) (internal)
#   sandbox: worker ↔ egress-proxy (internal)  ← Worker는 인터넷에 직접 닿지 않는다
#   egress : egress-proxy ↔ 조사 대상(testsites, 인터넷). 프록시가 연결마다 목적지 IP를 검사한다.

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  restart: unless-stopped

x-backend-env: &backend-env
  ENV: development
  DATABASE_URL: postgresql+psycopg://app:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/investigator
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
  URL_HOST_ALLOWLIST: '["testsites"]'

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: investigator
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d investigator"]
      interval: 5s
      retries: 10
    networks: [data]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [jobs]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      db: { condition: service_healthy }
    networks: [data]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: "no"

  backend:
    build: ./backend
    <<: *hardening
    environment:
      <<: *backend-env
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:?set WORKER_API_TOKEN in .env}
      EVIDENCE_DIR: /data/evidence
    read_only: true
    tmpfs: ["/tmp"]
    # 증거 파일은 backend만 쓴다. Worker는 이 볼륨에 접근하지 않고 API로만 업로드한다.
    volumes: ["evidence:/data/evidence"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [web, data, jobs, api]

  outbox-relay:
    build: ./backend
    <<: *hardening
    command: ["python", "-m", "app.services.outbox"]
    environment: *backend-env
    read_only: true
    tmpfs: ["/tmp"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [data, jobs]

  worker:
    build: ./worker
    <<: *hardening
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      API_BASE_URL: http://backend:8000
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:?set WORKER_API_TOKEN in .env}
      URL_HOST_ALLOWLIST: '["testsites"]'
      # 모든 브라우저 요청과 목적지 검사를 송신 프록시로 보낸다.
      EGRESS_PROXY_URL: http://egress-proxy:3128
      # Chromium 자체 샌드박스를 켠다(아래 seccomp 프로필 필요).
      CHROMIUM_SANDBOX: "true"
    read_only: true
    tmpfs: ["/tmp", "/home/pwuser"]
    shm_size: 1gb
    init: true
    # Docker 기본 seccomp 프로필 + Chromium 네임스페이스 샌드박스에 필요한 clone·unshare·setns·chroot 허용.
    # 권한(cap)은 모두 뺀 상태를 유지한다. 생성 방법은 worker/seccomp/generate.py 참고.
    security_opt: ["no-new-privileges:true", "seccomp=./worker/seccomp/chromium.json"]
    depends_on:
      redis: { condition: service_healthy }
      backend: { condition: service_started }
      egress-proxy: { condition: service_started }
    networks: [jobs, api, sandbox]

  egress-proxy:
    build: ./egress-proxy
    <<: *hardening
    read_only: true
    environment:
      # 개발용 시험 페이지만 사설 주소여도 허용한다. 운영에서는 비워 둔다.
      EGRESS_HOST_ALLOWLIST: '["testsites"]'
    # 포트를 공개하지 않는다. sandbox 네트워크의 Worker만 접근한다.
    networks: [sandbox, egress]

  frontend:
    build: ./frontend
    <<: *hardening
    read_only: true
    tmpfs: ["/tmp"]
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [backend]
    networks: [public, web]

  testsites:
    image: nginxinc/nginx-unprivileged:stable-alpine
    <<: *hardening
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - ./testsites/html:/usr/share/nginx/html:ro
      - ./testsites/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:8081:8080"]
    networks: [egress]

networks:
  public: {}
  web: { internal: true }
  data: { internal: true }
  jobs: { internal: true }
  api: { internal: true }
  sandbox: { internal: true }
  egress: {}

volumes:
  pgdata: {}
  redisdata: {}
  evidence: {}
