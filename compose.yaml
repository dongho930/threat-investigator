# 로컬 개발·시연용 구성. 실행: cp .env.example .env (비밀번호 변경) 후 docker compose up --build
#
# 네트워크 분리 (docs/threat-model.md 신뢰 경계 참고)
#   public : 콘솔 포트 공개용 (frontend만)
#   web    : frontend ↔ backend           (internal)
#   data   : backend·relay ↔ PostgreSQL   (internal)  ← Worker는 DB에 접근할 수 없다
#   jobs   : backend·relay·worker ↔ Redis (internal)
#   egress : worker ↔ 조사 대상(testsites, 인터넷). 3주차에 송신 방화벽·사설 IP 차단을 추가한다.

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  restart: unless-stopped

x-backend-env: &backend-env
  ENV: development
  DATABASE_URL: postgresql+psycopg://app:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/investigator
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
  URL_HOST_ALLOWLIST: '["testsites"]'

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: investigator
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d investigator"]
      interval: 5s
      retries: 10
    networks: [data]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [jobs]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      db: { condition: service_healthy }
    networks: [data]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: "no"

  backend:
    build: ./backend
    <<: *hardening
    environment: *backend-env
    read_only: true
    tmpfs: ["/tmp"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [web, data, jobs]

  outbox-relay:
    build: ./backend
    <<: *hardening
    command: ["python", "-m", "app.services.outbox"]
    environment: *backend-env
    read_only: true
    tmpfs: ["/tmp"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [data, jobs]

  worker:
    build: ./worker
    <<: *hardening
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    read_only: true
    tmpfs: ["/tmp", "/home/pwuser"]
    shm_size: 1gb
    init: true
    # TODO(3주차): Chromium 샌드박스용 seccomp 프로필 적용, 송신 방화벽(사설·예약 IP 차단) 추가
    depends_on:
      redis: { condition: service_healthy }
    networks: [jobs, egress]

  frontend:
    build: ./frontend
    <<: *hardening
    read_only: true
    tmpfs: ["/tmp"]
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [backend]
    networks: [public, web]

  testsites:
    image: nginxinc/nginx-unprivileged:stable-alpine
    <<: *hardening
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - ./testsites/html:/usr/share/nginx/html:ro
      - ./testsites/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:8081:8080"]
    networks: [egress]

networks:
  public: {}
  web: { internal: true }
  data: { internal: true }
  jobs: { internal: true }
  egress: {}

volumes:
  pgdata: {}
  redisdata: {}
