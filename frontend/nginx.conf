server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 64k;

    root /usr/share/nginx/html;

    # 엄격한 CSP: 인라인 스크립트·외부 스크립트를 허용하지 않는다 (SC-IN-01)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Start $msec;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri /index.html;
    }
}
