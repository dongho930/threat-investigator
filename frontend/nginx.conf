# 로그인 시도 IP 단위 제한(분당 10회, 순간 5회 여유). 계정 단위 잠금은 backend가 따로 한다 (SC-SF-01).
limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 64k;

    root /usr/share/nginx/html;

    # 엄격한 CSP: 인라인 스크립트·외부 스크립트를 허용하지 않는다 (SC-IN-01)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Worker 전용 내부 API는 콘솔 경로로 노출하지 않는다.
    location /internal/ {
        return 404;
    }

    # 신고 CSV 일괄 등록만 1MB까지 받는다(서버도 같은 한도로 다시 검사한다). 나머지 API는 64KB.
    location = /api/v1/reports/import {
        client_max_body_size 1m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Start $msec;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri /index.html;
    }
}
