<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>하늘은행 인터넷뱅킹 - 보안 인증</title></head>
<body>
<!-- 시험용 가상 브랜드. 폼은 어디로도 전송하지 않는다. -->
<header><strong>하늘은행</strong> 개인 인터넷뱅킹</header>
<h1>보안 강화를 위한 본인 확인</h1>
<p>고객님의 계정이 일시 정지되었습니다. 24시간 이내에 본인 인증을 완료하지 않으면 모든 거래가 제한됩니다.</p>
<form action="#" method="post" onsubmit="return false">
  <label>아이디 <input name="userid"></label><br>
  <label>비밀번호 <input name="password" type="password"></label><br>
  <label>보안카드 번호 전체 <input name="security_card"></label><br>
  <label>카드번호 <input name="card_number"></label>
  <label>CVC <input name="cvc"></label><br>
  <button type="submit">인증하기</button>
</form>
</body>
</html>
