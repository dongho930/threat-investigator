server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    charset utf-8;
    # 리다이렉트 Location을 상대 경로로 보낸다(컨테이너 내부 포트 8080이 노출되지 않게).
    absolute_redirect off;

    # 3단계 리다이렉트 체인 → 피싱 페이지
    location = /redirect/1 { return 302 /redirect/2; }
    location = /redirect/2 { return 301 /redirect/3; }
    location = /redirect/3 { return 302 /phishing.html; }

    # 무한 리다이렉트 (Worker의 리다이렉트 횟수 제한 시험)
    location = /loop/a { return 302 /loop/b; }
    location = /loop/b { return 302 /loop/a; }

    # SSRF 유도: 공개 페이지가 내부 주소로 보내는 경우 (Worker가 차단해야 함)
    location = /ssrf-metadata { return 302 http://169.254.169.254/latest/meta-data/; }
    location = /ssrf-localhost { return 302 http://127.0.0.1:8000/api/v1/cases; }

    # 하위 자원(이미지) 리다이렉트로 내부 주소 유도: 송신 프록시가 연결 시점에 막아야 함
    location = /img-redirect { return 302 http://169.254.169.254/latest/meta-data/; }

    # D1 평가 페이지의 3단계 리다이렉트 변형: /r3/<경로> → /r2 → /r1 → /<경로>
    location ~ ^/r3/(.*)$ { return 302 /r2/$1; }
    location ~ ^/r2/(.*)$ { return 301 /r1/$1; }
    location ~ ^/r1/(.*)$ { return 302 /$1; }

    # D2 공격 시나리오
    location = /d2/ssrf-private { return 302 http://10.0.0.1/; }
    location = /d2/ssrf-internal-service { return 302 http://backend:8000/api/health; }
    location ~ ^/d2/chain/([0-9]+)$ { return 302 /d2/chain/$1x; }
    location ~ "^/d2/chain/([0-9x]{1,14})$" { return 302 /d2/chain/$1x; }
    location = /d2/files/setup.exe {
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="setup.exe"';
    }

    location / { try_files $uri =404; }
}
